<header class="header">
  <div class="container">

    <nav aria-label="Главное меню">
      <ul class="menu">
        <!-- что менять: пункты меню; в href — id секции, к которой ведёт ссылка -->
        <li><a href="#about">О нас</a></li>
        <li><a href="#pets">Питомцы</a></li>
        <li><a href="#volunteer">Помочь</a></li>
      </ul>
    </nav>

    <!-- что менять: текст кнопки и куда она ведёт. Не нужна — удали строку -->
    <a class="button" href="#pets">Взять питомца</a>
  </div>
</header>
