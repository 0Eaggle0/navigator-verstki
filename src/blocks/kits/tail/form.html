<!-- Подключи form.css и form.js. Эта форма только проверяет поля. -->
<section class="kit-section kit-container" id="form">
  <h2>Стать волонтёром</h2>
  <p>Помоги приюту с прогулками, кормом или фотографиями питомцев.</p>
  <form class="kit-form" novalidate hidden>
    <label>Имя <input name="name" autocomplete="name" required></label>
    <label>Электронная почта <input type="email" name="email" autocomplete="email" required></label>
    <button class="kit-button" type="submit">Проверить заявку</button>
    <p role="status"></p>
  </form>
</section>
