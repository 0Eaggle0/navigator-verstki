<!-- При обновлении сбора поменяй и текст, и value у progress. -->
<section class="kit-section kit-container" id="progress">
  <h2>Пример сбора</h2>
  <article class="kit-progress-card">
    <h3 id="kit-goal">Поездка за город</h3>
    <p>Собрано <strong>8 400 ₽</strong> из 12 000 ₽</p>
    <progress aria-labelledby="kit-goal" value="8400" max="12000">70%</progress>
    <p>Осталось собрать 3 600 ₽.</p>
  </article>
</section>
