<!-- Вставь перед карточками. Подключи filters.css и filters.js. -->
<section class="kit-filters kit-container" id="filters" aria-labelledby="kit-filters-heading">
  <h2 id="kit-filters-heading">Выбери события</h2>
  <div class="kit-filters-list" role="group" aria-label="Стоимость" hidden>
    <button class="kit-button" type="button" data-kit-filter="all" aria-pressed="true">Все</button>
    <button class="kit-button" type="button" data-kit-filter="free" aria-pressed="false">Бесплатные</button>
    <button class="kit-button" type="button" data-kit-filter="paid" aria-pressed="false">Платные</button>
  </div>
  <p class="kit-filter-status" role="status"></p>
</section>
