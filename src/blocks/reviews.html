<!-- ОТЗЫВЫ. Вставь внутрь <main> -->
<section class="reviews">
  <!-- что менять: заголовок секции -->
  <h2 class="reviews__title">Что говорят тиммейты</h2>

  <div class="reviews__list">
    <!-- Один отзыв = один <figure>. Нужно больше — скопируй figure целиком -->
    <figure class="review">
      <!-- что менять: текст отзыва -->
      <blockquote>Нашёл команду на хакатон за вечер. Теперь делаем игру вчетвером!</blockquote>
      <figcaption class="review__author">
        <!-- что менять: аватар (img/…), имя и роль -->
        <span class="review__avatar" aria-hidden="true">🧑‍💻</span>
        <span><b>Дима</b>, программист</span>
      </figcaption>
      <!-- Оценку читают и глазами, и программы экранного доступа -->
      <p class="review__stars" aria-label="Оценка 5 из 5">★★★★★</p>
    </figure>

    <figure class="review">
      <blockquote>Удобно, что видно навыки сразу. Позвали меня рисовать персонажей.</blockquote>
      <figcaption class="review__author">
        <span class="review__avatar" aria-hidden="true">🎨</span>
        <span><b>Лиза</b>, художница</span>
      </figcaption>
      <p class="review__stars" aria-label="Оценка 4 из 5">★★★★☆</p>
    </figure>

    <figure class="review">
      <blockquote>Думал, никто не ищет сценариста. Ищут! Уже второй проект.</blockquote>
      <figcaption class="review__author">
        <span class="review__avatar" aria-hidden="true">✍️</span>
        <span><b>Артём</b>, тексты</span>
      </figcaption>
      <p class="review__stars" aria-label="Оценка 5 из 5">★★★★★</p>
    </figure>
  </div>
</section>
