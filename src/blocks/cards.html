<!-- СЕТКА КАРТОЧЕК. Вставь внутрь <main>. Классы те же, что в шагах маршрута: .cards, .card, .button -->
<!-- что менять: класс и id секции -->
<section class="pets" id="pets">
  <div class="container">
    <!-- что менять: заголовок секции -->
    <h2>Ищут дом</h2>

    <div class="cards">
      <!-- Одна карточка = один <article>. Нужно больше — скопируй article целиком -->
      <article class="card">
        <!-- что менять: путь к картинке и описание в alt -->
        <img src="img/barsik.svg" alt="Рыжий кот Барсик">
        <!-- что менять: заголовок и текст карточки -->
        <h3>Барсик</h3>
        <p>2 года, любит спать на коленях</p>
        <a class="button" href="#">Познакомиться</a>
      </article>

      <article class="card">
        <img src="img/sharik.svg" alt="Пёс Шарик с висячими ушами">
        <h3>Шарик</h3>
        <p>4 года, обожает долгие прогулки</p>
        <a class="button" href="#">Познакомиться</a>
      </article>

      <article class="card">
        <img src="img/murka.svg" alt="Серая кошка Мурка">
        <h3>Мурка</h3>
        <p>1 год, спокойная и ласковая</p>
        <a class="button" href="#">Познакомиться</a>
      </article>
    </div>
  </div>
</section>
