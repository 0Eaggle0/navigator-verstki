<!-- СЕТКА КАРТОЧЕК. Вставь внутрь <main> -->
<section class="cards-section" id="pets">
  <!-- что менять: заголовок секции -->
  <h2>Ищут дом</h2>

  <div class="cards">
    <!-- Одна карточка = один <article>. Нужно больше — скопируй article целиком -->
    <article class="card">
      <!-- что менять: путь к картинке и описание в alt -->
      <img class="card__img" src="img/barsik.svg" alt="Рыжий кот Барсик">
      <!-- что менять: заголовок и текст карточки -->
      <h3 class="card__title">Барсик</h3>
      <p class="card__text">2 года, любит спать на коленях</p>
      <a class="card__button" href="#">Познакомиться</a>
    </article>

    <article class="card">
      <img class="card__img" src="img/sharik.svg" alt="Пёс Шарик с висячими ушами">
      <h3 class="card__title">Шарик</h3>
      <p class="card__text">4 года, обожает долгие прогулки</p>
      <a class="card__button" href="#">Познакомиться</a>
    </article>

    <article class="card">
      <img class="card__img" src="img/murka.svg" alt="Серая кошка Мурка">
      <h3 class="card__title">Мурка</h3>
      <p class="card__text">1 год, спокойная и ласковая</p>
      <a class="card__button" href="#">Познакомиться</a>
    </article>
  </div>
</section>
