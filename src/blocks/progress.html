<!-- ПРИМЕР СБОРА С ПРОГРЕССОМ. Вставь внутрь <main> -->
<section class="collection">
  <h2>Как выглядит сбор</h2>

  <article class="collection__card">
    <!-- что менять: название и срок -->
    <h3 class="collection__title">Подарок Лене на день рождения</h3>
    <p class="collection__meta">До 15 октября · 6 участников</p>

    <!-- что менять: value — сколько собрано, max — сколько нужно -->
    <progress class="collection__bar" value="3200" max="5000">3200 из 5000 ₽</progress>
    <p class="collection__sum"><b>3 200 ₽</b> из 5 000 ₽</p>

    <!-- что менять: участники и суммы -->
    <ul class="collection__people">
      <li>Аня <span>1 000 ₽ ✓</span></li>
      <li>Петя <span>1 000 ₽ ✓</span></li>
      <li>Оля <span>1 200 ₽ ✓</span></li>
      <li>Дима <span class="collection__wait">ждём</span></li>
    </ul>
  </article>
</section>
