<!-- КАК ЭТО РАБОТАЕТ: три шага. Вставь внутрь <main> -->
<section class="steps">
  <!-- что менять: заголовок секции -->
  <h2 class="steps__title">Как это работает</h2>
  <ol class="steps__list">
    <!-- Один шаг = один <li>. Нужно 4 шага — скопируй li целиком. Номер поставится сам -->
    <li class="steps__item">
      <!-- что менять: иконка (можно <img src="img/icon.svg" alt="">), заголовок и текст шага -->
      <span class="steps__icon" aria-hidden="true">🏠</span>
      <h3>Создай комнату</h3>
      <p>Придумай название и позови друзей по ссылке.</p>
    </li>
    <li class="steps__item">
      <span class="steps__icon" aria-hidden="true">👆</span>
      <h3>Свайпайте фильмы</h3>
      <p>Каждый отмечает, что хочет посмотреть.</p>
    </li>
    <li class="steps__item">
      <span class="steps__icon" aria-hidden="true">🍿</span>
      <h3>Смотрите вместе</h3>
      <p>Сервис покажет фильм, который понравился всем.</p>
    </li>
  </ol>
</section>
