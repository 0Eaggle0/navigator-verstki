<!-- ШАПКА С БУРГЕР-МЕНЮ. Вставь сразу после <body> вместо обычной шапки -->
<header class="bheader">
  <!-- что менять: название или логотип -->
  <a class="bheader__logo" href="#">СКИНЕМСЯ</a>

  <!-- Кнопка видна только на телефоне. aria-label — подпись для программ экранного доступа -->
  <button class="bheader__burger" type="button" aria-expanded="false" aria-label="Открыть меню">☰</button>

  <nav class="bheader__menu" aria-label="Главное меню">
    <!-- что менять: пункты меню -->
    <a href="#collections">Мои сборы</a>
    <a href="#how">Как это работает</a>
    <a href="#login">Войти</a>
  </nav>
</header>
