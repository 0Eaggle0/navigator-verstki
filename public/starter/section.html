<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя секция</title>
  <!--
    ШАБЛОН ДЛЯ РАБОТЫ ВЧЕТВЕРОМ. Как пользоваться:
    1. Положи section.html и section.css в папку проекта рядом со style.css.
       Свежий style.css возьми у модератора — в нём общие цвета, шрифты, .container и .button.
    2. Переименуй файлы под свою секцию, например pets.html и pets.css,
       и поправь имя файла в строке <link> ниже.
    3. Пиши свою секцию внутри <main>. Все свои стили начинай с класса секции: .pets h2, .pets .card.
    4. Сборка: модератор копирует твою <section> целиком в index.html,
       а содержимое твоего .css — в конец style.css.
  -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="section.css">
</head>
<body>
  <main>
    <!-- твоя секция здесь -->
    <section class="pets" id="pets">
      <div class="container">
        <h2>Ищут дом</h2>
      </div>
    </section>
  </main>
</body>
</html>
